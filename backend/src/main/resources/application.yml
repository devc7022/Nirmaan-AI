spring:
  application:
    name: nirmaan-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nirmaan}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:nirmaan-development-jwt-secret-key-must-be-long}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
    issuer: ${JWT_ISSUER:nirmaan-api}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${AI_MODEL:gemini-1.5-flash}
